<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Avatar Tools - VPM Repository</title>
    <style>
        body {
            background-color: #0f1115;
            color: #e6e6e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #181b21;
            border: 1px solid #282c34;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        p {
            color: #8f96a3;
            line-height: 1.5;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #555d6b;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>ECLIPSE AVATAR TOOLS</h1>
    <p>Advanced workflow tools for VRChat avatar optimization, Quest conversion, auto-setup, and rendering.</p>
    
    <!-- Remplacez VOTRE_PSEUDO ci-dessous -->

        Add to VCC
    </a>

    <div class="footer">
        Made with ❤️ by Frost
    </div>
</div>

</body>
</html>
